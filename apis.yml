aid: marker
name: Marker
description: >-
  Marker is a writing tool for people who believe in writing — a calm, focused
  space for thinking and writing that acts as your partner and editor from first
  idea to final draft. Backed by Index Ventures, Marker sits in the future-of-work
  space and offers a distraction-free web application (my.marker.page) for
  drafting long-form writing. It is a consumer product web app: as of this
  enrichment pass it publishes no public developer API, SDKs, developer
  documentation, or /.well-known discovery surface, so this profile captures its
  identity and a live domain-security probe only.
